<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SensorFinder for Razer Huntsman</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --border: #d8dde3;
    --key: #eef1f4; --key-text: #2a3038; --accent: #13a10e; --accent-soft: rgba(19, 161, 14, 0.18);
    --warn: #c26a00; --warn-soft: rgba(194, 106, 0, 0.14); --danger: #c62828; --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
    --sense: #2f6fdf; --grid: #e6e9ed;
    --accent-btn: #0b6b08; --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --panel: #1a1e24; --text: #e6e9ed; --muted: #97a3b2; --border: #2c333c;
      --key: #242a32; --key-text: #d5dbe2; --accent: #44d62c; --accent-soft: rgba(68, 214, 44, 0.2);
      --warn: #ffa733; --warn-soft: rgba(255, 167, 51, 0.16); --danger: #ff6b6b; --sense: #6ea8ff; --grid: #262c34; --accent-btn: #44d62c; --on-accent: #0b1a07;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111418; --panel: #1a1e24; --text: #e6e9ed; --muted: #97a3b2; --border: #2c333c;
    --key: #242a32; --key-text: #d5dbe2; --accent: #44d62c; --accent-soft: rgba(68, 214, 44, 0.2);
    --warn: #ffa733; --warn-soft: rgba(255, 167, 51, 0.16); --danger: #ff6b6b; --sense: #6ea8ff; --grid: #262c34; --accent-btn: #44d62c; --on-accent: #0b1a07;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  p { margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, select, input { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--border); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent-btn); border-color: var(--accent-btn); color: var(--on-accent); font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  select, input[type="number"] { background: var(--panel); border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; }
  input[type="number"] { width: 90px; }
  .tabs { display: flex; gap: 4px; margin-top: 14px; border-bottom: 1px solid var(--border); }
  .tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; color: var(--muted); }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--key); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--accent); }
  .note { padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); border-left: 3px solid var(--warn); margin-top: 10px; }
  .error { color: var(--danger); }

  .kb-wrap { overflow-x: auto; }
  .kb { position: relative; width: 100%; min-width: 640px; aspect-ratio: 22.5 / 6.25; }
  .key { position: absolute; padding: 2px; }
  .key > div { position: relative; height: 100%; border-radius: 5px; background: var(--key); border: 1px solid var(--border); overflow: hidden; color: var(--key-text); font-size: 11px; display: flex; align-items: flex-start; justify-content: flex-start; padding: 2px 4px; }
  .key .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--sense); opacity: 0.75; height: 0; }
  .key.on .fill { background: var(--accent); opacity: 0.9; }
  .key .mark { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--text); opacity: 0.55; z-index: 1; display: none; }
  .key .mark.rel { border-top: 1px dashed var(--muted); opacity: 0.8; }
  .key .lbl { position: relative; z-index: 1; white-space: nowrap; }
  .key .cnt { position: absolute; right: 3px; bottom: 1px; z-index: 1; font-size: 10px; font-family: var(--mono); color: var(--warn); font-weight: 700; }
  .key.touched > div { border-color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); background: var(--warn-soft); }
  .key.fired > div { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
  .key.fired .cnt { color: var(--accent); }
  .key.live > div { box-shadow: 0 0 0 2px var(--sense); }
  .key.on > div { box-shadow: 0 0 0 2px var(--accent); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
  .chart-wrap { position: relative; height: 240px; }
  .chart-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 12px; font-family: var(--mono); white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .ok { color: var(--accent); font-weight: 600; }
  a { color: var(--sense); }
  .key.selected > div { outline: 2px dashed var(--text); outline-offset: -3px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; font-family: var(--mono); }
  .scroll { max-height: 360px; overflow: auto; }
  pre { font-family: var(--mono); font-size: 12px; margin: 0; white-space: pre-wrap; word-break: break-all; }
  .hidden { display: none !important; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-family: var(--mono); }
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content: space-between; align-items: flex-start">
    <h1>SensorFinder <span class="muted" style="font-weight: 500">for Razer Huntsman</span></h1>
    <button id="lang" data-i18n="langButton"></button>
  </div>
  <p class="muted" data-i18n="subtitle"></p>

  <div id="unsupported" class="note hidden" data-i18n-html="unsupportedHtml"></div>

  <div class="panel">
    <div class="row">
      <button id="connect" class="primary" data-i18n="connect"></button>
      <span class="status"><span id="dot" class="dot"></span><span id="devname"></span></span>
      <span class="status"><span data-i18n="reports"></span> <span id="reports" style="font-family: var(--mono)">0</span></span>
      <span id="modehint" class="status hidden"></span>
    </div>
    <p id="connectError" class="error hidden" style="margin-top: 8px"></p>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="monitor" data-i18n="tabMonitor"></button>
    <button role="tab" aria-selected="false" data-tab="actuation" data-i18n="tabActuation"></button>
  </div>

  <!-- ===== Monitor ===== -->
  <section id="tab-monitor">
    <div class="panel">
      <div class="row" style="justify-content: space-between">
        <h2 style="margin: 0" data-i18n="mapTitle"></h2>
        <div class="row">
          <label><span data-i18n="noise"></span> <input id="noise" type="number" min="0" value="0"></label>
          <button id="reset" data-i18n="reset"></button>
          <button id="csv" data-i18n="csv"></button>
        </div>
      </div>
      <div class="row" style="margin-top: 10px">
        <span data-i18n="thrLabel"></span>
        <select id="thrProfile">
          <option value="0" data-i18n="optRam"></option>
          <option value="active" data-i18n="optActiveSlot"></option>
        </select>
        <button id="thrLoad" data-i18n="thrLoad"></button>
        <span id="thrStatus" class="muted"></span>
      </div>
      <p class="muted" style="margin-top: 8px">
        <span class="swatch" style="background: var(--sense)"></span><span data-i18n="legendSense"></span>
        <span class="swatch" style="background: var(--accent); margin-left: 10px"></span><span data-i18n="legendOn"></span>
        <span data-i18n-html="legendRestHtml"></span>
      </p>
      <div class="kb-wrap"><div id="kb" class="kb"></div></div>
      <div id="extraKeys" class="row hidden" style="margin-top: 8px"></div>
      <div id="noStream" class="note hidden"></div>
    </div>

    <div class="panel">
      <div class="row" style="justify-content: space-between">
        <h2 id="chartTitle" style="margin: 0"></h2>
        <label><input id="follow" type="checkbox" checked> <span data-i18n="follow"></span></label>
      </div>
      <p id="chartReadout" class="muted" style="margin: 6px 0 8px; font-family: var(--mono)"></p>
      <div id="chartWrap" class="chart-wrap"><canvas id="chart"></canvas><div id="tip" class="tip hidden"></div></div>
      <p class="muted" style="margin-top: 6px" data-i18n-html="chartNoteHtml"></p>
    </div>

    <div class="grid2">
      <div class="panel">
        <h2 data-i18n="rankTitle"></h2>
        <p class="muted" style="font-size: 12px" data-i18n="rankNote"></p>
        <div class="scroll">
          <table>
            <thead><tr><th data-i18n="thKey"></th><th class="num" data-i18n="thTouches"></th><th class="num" data-i18n="thInputs"></th><th class="num" data-i18n="thPeak"></th><th class="num" data-i18n="thPoints"></th><th class="num" data-i18n="thMargin"></th></tr></thead>
            <tbody id="ranking"></tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <h2 data-i18n="logTitle"></h2>
        <div class="scroll">
          <table>
            <thead><tr><th data-i18n="thTime"></th><th data-i18n="thKey"></th><th class="num" data-i18n="thDuration"></th><th class="num" data-i18n="thPeak"></th><th data-i18n="thVerdict"></th></tr></thead>
            <tbody id="events"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="row" style="justify-content: space-between">
        <h2 style="margin: 0" data-i18n="rawTitle"></h2>
        <label><input id="rawToggle" type="checkbox"> <span data-i18n="rawShow"></span></label>
      </div>
      <pre id="raw" class="hidden" style="margin-top: 8px"></pre>
      <p class="muted" style="margin-top: 8px" data-i18n="rawNote"></p>
    </div>
  </section>

  <!-- ===== Actuation ===== -->
  <section id="tab-actuation" class="hidden">
    <div class="panel">
      <h2 data-i18n="actTitle"></h2>
      <p class="muted" data-i18n-html="actIntroHtml"></p>
      <div class="note" data-i18n-html="actWarnHtml"></div>
      <div class="note" style="border-left-color: var(--danger)">
        <b data-i18n="safetyTitle"></b>
        <div data-i18n-html="safetyHtml" style="margin: 6px 0"></div>
        <label><input id="safetyAgree" type="checkbox"> <span data-i18n="safetyAgree"></span></label>
      </div>
      <div class="row" style="margin-top: 12px">
        <label><span data-i18n="actKey"></span> <select id="actKey"></select></label>
        <label><span data-i18n="actTarget"></span>
          <select id="actProfile">
            <option value="0" data-i18n="actOptRam"></option>
            <option value="active" data-i18n="actOptSlot"></option>
          </select>
        </label>
        <button id="actRead" data-i18n="actRead"></button>
      </div>
      <dl id="actInfo" class="kv hidden" style="margin-top: 12px"></dl>
      <div class="row" style="margin-top: 12px">
        <label><span data-i18n="actNewPoint"></span> <input id="actMm" type="number" step="0.1" min="0.1" max="4.0" value="2.0"> mm</label>
        <label><span data-i18n="actRelease"></span> <input id="actRelMm" type="number" step="0.1" min="0" max="4.0" value=""> mm</label>
        <button id="actRelSuggest" data-i18n="actSuggest" data-i18n-title="actSuggestTitle"></button>
        <button id="actWrite" class="primary" disabled data-i18n="actApply"></button>
        <button id="actUndo" class="hidden"></button>
      </div>
      <p id="actRange" class="muted" style="margin-top: 6px"></p>
      <p class="muted" style="margin-top: 2px" data-i18n-html="actHelpHtml"></p>
      <pre id="actLog" style="margin-top: 10px"></pre>
    </div>
  </section>

  <p class="muted" style="margin-top: 16px; font-size: 12px"><span data-i18n="footer"></span>
    <a href="https://github.com/ohy1/SensorFinder-for-Razer-Huntsman/blob/HEAD/SAFETY.md" target="_blank" rel="noopener" data-i18n="safetyLink"></a></p>
</main>

<script src="razer-protocol.js"></script>
<script src="i18n.js"></script>
<script>
'use strict';
const P = RazerProtocol;
const $ = (id) => document.getElementById(id);
const tr = (key, vars) => I18N.t(key, vars);

function langStrings() {
  return Object.prototype.hasOwnProperty.call(I18N.strings, I18N.lang) ? I18N.strings[I18N.lang] : I18N.strings.en;
}

function keyName(id) {
  return langStrings().keyNames[id] || P.keyName(id);
}

const state = {
  devices: [],        // opened HIDDevice objects of the keyboard
  control: null,      // HIDDevice that answers the 90-byte feature report
  productId: null,
  family: null,
  tracker: new P.DepthTracker(),
  rawLog: [],
  dirty: true,
  wallOffset: Date.now() - performance.now(),
  streamSeen: false,
  unrecognized: 0,     // reports from an unknown model in a format this page cannot read
  thresholds: new Map(),  // fwID -> {thrL, thrH} in threshold units
  chartKey: null,
  // {productId, profile, key, thrL, thrH, wroteL, wroteH, pending, at, device} replaced by the last
  // write; `device` (the HIDDevice written to) is never stored, so a restored record has none.
  undo: null,
  thrMsg: ['thrNotLoaded', null, []], // [string key, () => vars, extras], re-rendered on language change
  thrProfile: undefined, // profile the monitor's points were loaded from
  lostDevice: false,
  busy: false,         // a read/write/undo/load is talking to the keyboard
  lastRead: null,      // exact values behind the pre-filled mm fields, and the device they came from
  mode: null,          // last device mode read with 00:84 (0 hardware, 3 driver)
  ramEdited: false,    // a RAM write changed the monitor's points; RAM reverts on replug
  thrPartial: false,   // the loaded points miss keys that could not be read
  multiUnit: false,    // two keyboards of the same model are attached at once
  foreignBefore: {},   // per model: saved Undo/points up to this time belong to a unit picked away from
};

const CHART_MS = 5000;

// ---------- keyboard map ----------
const keyEls = new Map();
const TOTAL_W = 22.5, TOTAL_H = 6.25;
function buildKeyboard() {
  const kb = $('kb');
  for (const k of P.layoutKeys()) {
    const el = document.createElement('div');
    el.className = 'key';
    el.style.left = (k.x / TOTAL_W * 100) + '%';
    el.style.top = (k.y / TOTAL_H * 100) + '%';
    el.style.width = (k.w / TOTAL_W * 100) + '%';
    el.style.height = (k.h / TOTAL_H * 100) + '%';
    el.title = `${keyName(k.id)} (fwID ${k.id})`;
    el.innerHTML = `<div><span class="fill"></span><span class="mark"></span><span class="mark rel"></span><span class="lbl"></span><span class="cnt"></span></div>`;
    el.querySelector('.lbl').textContent = langStrings().keyNames[k.id] || P.shortKeyName(k.id);
    el.addEventListener('click', () => {
      selectActuationKey(k.id);
      state.chartKey = k.id;
      $('follow').checked = false;
      state.dirty = true;
    });
    kb.appendChild(el);
    keyEls.set(k.id, el);
  }
}

function fam() {
  return P.FAMILIES[state.family || 'v3'];
}

function mm(raw) {
  return fam().rawToMm(raw).toFixed(2);
}

function depthText(raw) {
  return `≈${mm(raw)} mm`;
}

/** A positive difference in raw depth units, in mm. */
function diffMm(d) {
  const f = fam();
  return (f.rawToMm(d) - f.rawToMm(0)).toFixed(2);
}

/** Live depth for display: raw 0 means the key is not in the stream (at rest). */
function liveDepth(raw) {
  return raw > 0 ? `${mm(raw)} mm` : tr('atRest');
}

function thrRaw(id) {
  return state.tracker.thresholds.get(id) || null;
}

function verdict(e) {
  if (e.fired === null || e.fired === undefined) {
    return `<span class="muted">${tr(e.interrupted ? 'verdictInterrupted' : 'verdictUnknown')}</span>`;
  }
  if (e.fired) {
    const n = e.activations > 1 ? ` ×${e.activations}` : '';
    // A touch whose start was not seen (held through Clear) has no time to input.
    if (e.firstOnMs === null) return `<span class="ok">${tr('verdictFired')}${n}</span>`;
    return `<span class="ok">${tr('verdictFired')}${n}</span> <span class="muted">${tr('verdictFiredDetail', { ms: Math.round(e.firstOnMs), held: fmtMs(e.heldMs) })}</span>`;
  }
  // A non-positive margin means the points changed after this touch was recorded.
  if (!(e.marginRaw > 0)) return `<span class="muted">${tr('verdictUnknown')}</span>`;
  return `<span style="color: var(--warn)">${tr('verdictMissed')}</span> <span class="muted">${tr('verdictShort', { mm: diffMm(e.marginRaw) })}</span>`;
}

function fmtMs(ms) {
  return ms >= 1000 ? (ms / 1000).toFixed(1) + ' s' : Math.round(ms) + ' ms';
}

function hms(d) {
  return [d.getHours(), d.getMinutes(), d.getSeconds()].map((n) => String(n).padStart(2, '0')).join(':');
}

function fmtClock(perfT) {
  const d = new Date(state.wallOffset + perfT);
  return hms(d) + '.' + String(d.getMilliseconds()).padStart(3, '0');
}

function render() {
  if (!$('tab-monitor').classList.contains('hidden')) drawChart();
  if (!state.dirty) return requestAnimationFrame(render);
  state.dirty = false;
  const t = state.tracker;
  const rawMax = fam().rawMax;
  const extra = [];

  for (const [id, el] of keyEls) {
    const live = t.live.get(id) || 0;
    const s = t.stats.get(id);
    const thr = thrRaw(id);
    el.classList.toggle('live', live > 0);
    el.classList.toggle('on', t.active.has(id));
    // Orange only means something when the key's points were known while it was touched.
    // Not after the points were moved shallower than a recorded press: that key did reach them.
    el.classList.toggle('touched', !!s && !!thr && s.judgedTouches > 0 && !s.activations && s.peak < thr.press);
    el.classList.toggle('fired', !!s && s.activations > 0);
    el.querySelector('.fill').style.height = Math.min(100, Math.max(live > 0 ? 6 : 0, live / rawMax * 100)) + '%';
    el.querySelector('.cnt').textContent = s ? s.touches : '';
    const [on, rel] = el.querySelectorAll('.mark');
    // Only on keys worth looking at; on every tile the lines just add noise.
    const showMarks = thr && (s || id === state.chartKey);
    on.style.display = rel.style.display = showMarks ? 'block' : 'none';
    if (thr) {
      on.style.bottom = (thr.press / rawMax * 100) + '%';
      rel.style.bottom = (thr.release / rawMax * 100) + '%';
    }
  }
  for (const [id, s] of t.stats) if (!keyEls.has(id)) extra.push({ id, s, live: t.live.get(id) || 0 });
  $('extraKeys').classList.toggle('hidden', extra.length === 0);
  $('extraKeys').innerHTML = extra.map((e) =>
    `<span class="status">${esc(tr('extraKey', { name: keyName(e.id), n: e.s.touches, live: e.live }))}</span>`).join('');

  const rank = t.ranking();
  $('ranking').innerHTML = rank.length ? rank.map((r) => {
    const thr = thrRaw(r.id);
    const points = thr ? `${mm(thr.press)} / ${mm(thr.release)}` : '—';
    // A margin only when every recorded press stayed short of the current point.
    const left = thr ? thr.press - r.peak : 0;
    const margin = !thr ? '—' : r.activations ? `<span class="ok">${tr('verdictFired')}</span>`
      : r.judgedTouches && left > 0 ? `${diffMm(left)} mm` : '—';
    const inputs = thr && (r.activations || r.judgedTouches) ? r.activations : '—';
    return `<tr>
      <td>${esc(keyName(r.id))} <span class="muted">#${r.id}</span>${r.inputOn ? ' <span class="ok">●</span>' : ''}</td>
      <td class="num">${r.touches}</td><td class="num">${inputs}</td>
      <td class="num">${esc(depthText(r.peak))}</td><td class="num">${points}</td><td class="num">${margin}</td></tr>`;
  }).join('') : `<tr><td colspan="6" class="muted">${tr('noKeys')}</td></tr>`;

  const evs = t.events.slice(-200).reverse();
  const open = [...t.open.values()].map((o) => ({ ...o, live: true }));
  const rows = [...open, ...evs].sort((a, b) => b.start - a.start);
  $('events').innerHTML = rows.length ? rows.map((e) => `<tr>
      <td>${fmtClock(e.start)}</td><td>${esc(keyName(e.id))}</td>
      <td class="num">${e.live ? tr('inProgress') : fmtMs(e.durationMs)}</td><td class="num">${esc(depthText(e.peak))}</td>
      <td>${e.live ? (t.active.has(e.id) ? `<span class="ok">${tr('inputOn')}</span>` : `<span class="muted">${tr('sensing')}</span>`) : verdict(e)}</td></tr>`).join('')
    : `<tr><td colspan="5" class="muted">${tr('noEvents')}</td></tr>`;

  $('reports').textContent = t.reports;
  if (!$('raw').classList.contains('hidden')) $('raw').textContent = state.rawLog.join('\n');
  requestAnimationFrame(render);
}

// ---------- depth chart ----------
const chart = { hoverX: null, readout: '' };

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function valueAt(h, time) {
  let v = 0;
  for (const [ts, raw] of h) {
    if (ts > time) break;
    v = raw;
  }
  return v;
}

function drawChart() {
  const t = state.tracker;
  if ($('follow').checked && t.lastId !== null) state.chartKey = t.lastId;
  const id = state.chartKey;
  const wrap = $('chartWrap'), canvas = $('chart');
  const dpr = window.devicePixelRatio || 1;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const f = fam();
  const c = { text: cssVar('--text'), muted: cssVar('--muted'), grid: cssVar('--grid'), sense: cssVar('--sense'),
    on: cssVar('--accent-soft'), accent: cssVar('--accent') };
  const pad = { l: 48, r: 12, t: 8, b: 22 };
  const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
  const now = performance.now(), from = now - CHART_MS;
  const x = (time) => pad.l + ((time - from) / CHART_MS) * pw;
  const y = (raw) => pad.t + (1 - Math.min(Math.max(raw, 0), f.rawMax) / f.rawMax) * ph;

  // Grid and axes: solid hairlines, labels in muted ink.
  ctx.font = '11px system-ui, sans-serif';
  ctx.lineWidth = 1;
  ctx.fillStyle = c.muted;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (const g of f.gridMm) {
    const gy = Math.round(y(f.mmToRaw(g))) + 0.5;
    ctx.strokeStyle = c.grid;
    ctx.beginPath(); ctx.moveTo(pad.l, gy); ctx.lineTo(pad.l + pw, gy); ctx.stroke();
    ctx.fillText(`${g} mm`, pad.l - 6, gy);
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (let s = 5; s >= 0; s--) ctx.fillText(s ? `-${s} s` : tr('axisNow'), x(now - s * 1000), pad.t + ph + 6);

  const h = id === null ? null : t.history.get(id);
  const thr = id === null ? null : thrRaw(id);
  const name = id === null ? '' : keyName(id);
  $('chartTitle').textContent = id === null ? tr('chartTitle') : tr('chartTitleKey', { name });

  ctx.save();
  ctx.beginPath(); ctx.rect(pad.l, pad.t, pw, ph); ctx.clip();
  // Input-on spans as a soft band behind the trace.
  for (const [s0, s1] of (id !== null && t.onSpans.get(id)) || []) {
    const a = x(Math.max(s0, from)), b = x(s1 === null ? now : s1);
    if (b > pad.l) { ctx.fillStyle = c.on; ctx.fillRect(a, pad.t, b - a, ph); }
  }
  // Actuation (solid ink) and release (muted) points.
  if (thr) {
    for (const [raw, color, dash] of [[thr.press, c.text, []], [thr.release, c.muted, [4, 3]]]) {
      const ly = Math.round(y(raw)) + 0.5;
      ctx.strokeStyle = color; ctx.setLineDash(dash); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(pad.l, ly); ctx.lineTo(pad.l + pw, ly); ctx.stroke();
    }
    ctx.setLineDash([]);
  }
  // Depth trace (step line: the stream only reports changes).
  let peak = 0;
  if (h && h.length) {
    ctx.strokeStyle = c.sense; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath();
    let prev = h[0][1];
    ctx.moveTo(x(Math.max(h[0][0], from)), y(prev));
    if (h[0][0] >= from || h.length === 1) peak = prev;
    for (let i = 1; i < h.length; i++) {
      const [ts, raw] = h[i];
      ctx.lineTo(x(ts), y(prev));
      ctx.lineTo(x(ts), y(raw));
      if (ts >= from) peak = Math.max(peak, raw, prev);
      prev = raw;
    }
    peak = Math.max(peak, prev); // the last level lasts until now
    ctx.lineTo(x(now), y(prev));
    ctx.stroke();
  }
  ctx.restore();

  // Direct labels for the two points, at the left edge so they never sit on the live end.
  if (thr) {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = c.text;
    ctx.fillText(tr('chartAct', { mm: mm(thr.press) }), pad.l + 6, y(thr.press) - 3);
    ctx.textBaseline = 'top';
    ctx.fillStyle = c.muted;
    ctx.fillText(tr('chartRel', { mm: mm(thr.release) }), pad.l + 6, y(thr.release) + 3);
  }

  // Hover crosshair + tooltip.
  const tip = $('tip');
  if (chart.hoverX !== null && h && chart.hoverX >= pad.l && chart.hoverX <= pad.l + pw) {
    const time = from + ((chart.hoverX - pad.l) / pw) * CHART_MS;
    const v = valueAt(h, time);
    const on = ((t.onSpans.get(id)) || []).some(([a, b]) => time >= a && time <= (b === null ? now : b));
    ctx.strokeStyle = c.muted; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(Math.round(chart.hoverX) + 0.5, pad.t); ctx.lineTo(Math.round(chart.hoverX) + 0.5, pad.t + ph); ctx.stroke();
    ctx.fillStyle = c.sense;
    ctx.beginPath(); ctx.arc(chart.hoverX, y(v), 4, 0, Math.PI * 2); ctx.fill();
    tip.textContent = tr('tipAgo', { s: ((now - time) / 1000).toFixed(2), depth: liveDepth(v) }) + (thr ? tr(on ? 'tipOn' : 'tipOff') : '');
    tip.classList.remove('hidden');
    tip.style.left = Math.min(chart.hoverX + 12, W - tip.offsetWidth - 4) + 'px';
    tip.style.top = Math.max(0, y(v) - 30) + 'px';
  } else {
    tip.classList.add('hidden');
  }

  let readout = tr('readoutIdle');
  if (id !== null) {
    const live = t.live.get(id) || 0;
    const status = tr(!thr ? 'stUnknown' : t.active.has(id) ? 'stOn' : live ? 'stSensing' : 'stIdle');
    readout = tr('readout', { cur: liveDepth(live), peak: liveDepth(peak) })
      + (thr ? tr('readoutPoints', { on: mm(thr.press), off: mm(thr.release) }) : '') + ` · ${status}`;
  }
  if (readout !== chart.readout) $('chartReadout').textContent = chart.readout = readout;
}

// ---------- thresholds (actuation / release points) ----------
const EXTRA_THRESHOLD_IDS = [152, 153]; // Hanja / Hangeul on KR boards; others answer "fail"

/**
 * Shows a status message; `vars` is a function so the text can be rebuilt in another language,
 * `extras` are [key, vars] pairs appended to it.
 */
function thrStatus(key, vars = null, extras = []) {
  state.thrMsg = [key, vars, extras];
  renderThrStatus();
}

function renderThrStatus() {
  const [key, vars, extras] = state.thrMsg;
  $('thrStatus').textContent = tr(key, vars ? vars() : null) + (extras || []).map(([k, v]) => tr(k, v)).join('');
}

function applyThresholds(map) {
  const f = fam();
  state.thresholds = map;
  $('thrLoad').classList.toggle('primary', !map.size);
  state.tracker.setThresholds([...map].map(([id, v]) =>
    [id, { press: f.thresholdToRaw(v.thrL), release: f.thresholdToRaw(v.thrH) }]));
  state.dirty = true;
}

function thresholdStoreKey() {
  return `rsf.thresholds.${state.productId}`;
}

function saveThresholds(profile) {
  try {
    const keys = Object.fromEntries([...state.thresholds].map(([id, v]) => [id, [v.thrL, v.thrH]]));
    localStorage.setItem(thresholdStoreKey(), JSON.stringify({ profile, savedAt: Date.now(), keys }));
  } catch (err) { /* storage unavailable: thresholds just won't survive a reload */ }
}

/** Updates one key in the saved set if that set was loaded from `profile` (flash keeps writes). */
function patchSavedThreshold(profile, key, v) {
  try {
    const saved = JSON.parse(localStorage.getItem(thresholdStoreKey()) || 'null');
    if (!saved || saved.profile !== profile || !saved.keys || typeof saved.keys !== 'object' || Array.isArray(saved.keys)) return;
    if ((Number(saved.savedAt) || 0) <= foreignCutoff()) return; // another unit's set
    if (v.thrL > 0) saved.keys[key] = [v.thrL, v.thrH];
    else delete saved.keys[key];
    localStorage.setItem(thresholdStoreKey(), JSON.stringify(saved));
  } catch (err) { /* storage unavailable */ }
}

// RAM written during this plug session, kept per tab so a reload knows the saved points may not
// match RAM. Cleared on replug (RAM goes back to the active profile) and on a keyboard switch.
function ramWriteKey() {
  return `rsf.ramWritten.${state.productId}`;
}

function ramWritten() {
  try { return sessionStorage.getItem(ramWriteKey()) === '1'; } catch (err) { return false; }
}

function setRamWritten(on) {
  try {
    if (on) sessionStorage.setItem(ramWriteKey(), '1');
    else sessionStorage.removeItem(ramWriteKey());
  } catch (err) { /* only the reload hint is lost */ }
}

/** RAM went back to the active profile (replug): RAM edits in the monitor's points are void. */
function ramReverted() {
  setRamWritten(false);
  if (!state.ramEdited) return;
  state.ramEdited = false;
  // In one step, so only the keys whose points really change lose their verdicts.
  if (!restoreThresholds()) {
    applyThresholds(new Map());
    thrStatus('thrNotLoaded');
  }
}

/** Synapse started or quit, and may have re-applied its profile over RAM edits. */
function modeChanged() {
  if (!state.ramEdited && !ramWritten()) return;
  thrStatus('thrModeChanged');
  $('thrLoad').classList.add('primary');
}

function hasSavedThresholds() {
  try { return !!localStorage.getItem(thresholdStoreKey()); } catch (err) { return false; }
}

/** Saved records of this model from before this time belong to a unit picked away from (-1: none). */
function foreignCutoff() {
  return state.foreignBefore[state.productId] || -1;
}

/** The saved points for this model as {map, profile, when}, or null. */
function savedThresholds() {
  try {
    const saved = JSON.parse(localStorage.getItem(thresholdStoreKey()) || 'null');
    if (!saved || typeof saved.keys !== 'object' || !saved.keys) return null;
    const when = Number(saved.savedAt) || 0;
    if (when <= foreignCutoff()) return null; // saved for the unit picked away from
    const ok = (t) => Number.isInteger(t) && t >= 0 && t <= 255;
    // The storage is shared with other pages on this origin: take only well-formed entries.
    const map = new Map(Object.entries(saved.keys)
      .filter(([id, v]) => P.KEY_NAMES[Number(id)] && Array.isArray(v) && ok(v[0]) && ok(v[1]) && v[0] > 0)
      .map(([id, [thrL, thrH]]) => [Number(id), { thrL, thrH }]));
    return map.size ? { map, profile: Number.isInteger(saved.profile) ? saved.profile : 0, when } : null;
  } catch (err) { return null; } // unreadable cache
}

/** Uses the saved points, if any; returns whether there were some. */
function restoreThresholds() {
  const saved = savedThresholds();
  if (!saved) return false;
  applyThresholds(saved.map);
  state.thrPartial = false;
  state.ramEdited = false;
  state.thrProfile = saved.profile;
  thrStatus('thrCached', () => ({ p: saved.profile, date: new Date(saved.when).toLocaleString(I18N.locale()) }),
    ramWritten() ? [['thrRamWritten', null]] : []);
  return true;
}

async function loadThresholds() {
  if (state.busy) return;
  if (!state.devices.length) return thrStatus('errConnectFirst');
  await withBusy(async () => {
    const pid = state.productId;
    const SWITCHED = {}, LOST = {};
    const gone = () => {
      if (state.productId !== pid) throw SWITCHED;
      if (!state.devices.length) throw LOST;
    };
    try {
      let profile = 0, fellBack = false;
      if ($('thrProfile').value === 'active') {
        // In driver mode profile 0 holds a copy of the active profile, so it is a sound fallback.
        try { profile = await activeProfile(); } catch (err) { fellBack = true; }
      }
      const ids = [...keyEls.keys(), ...EXTRA_THRESHOLD_IDS];
      const map = new Map();
      let zero = 0, refused = 0, lastErr = null;
      let pending = ids;
      // Second pass for keys whose reads kept colliding with another program's requests.
      for (let pass = 0; pass < 2 && pending.length; pass++) {
        const retry = [];
        for (let i = 0; i < pending.length; i++) {
          gone();
          thrStatus('thrLoading', () => ({ i: i + 1, n: pending.length }));
          let a = null;
          try { a = await readKey(profile, pending[i]); } catch (err) {
            lastErr = err;
            // 03 fail / 05 not supported: the board has no such key (e.g. 한자/한영 on ANSI).
            if (err.status === 3 || err.status === 5) { refused++; continue; }
          }
          // thrL 0 means the host decides (or the key has no analog point): nothing to judge against.
          if (a && a.thrL > 0) map.set(pending[i], { thrL: a.thrL, thrH: a.thrH });
          else if (a) zero++;
          else retry.push(pending[i]);
        }
        pending = retry;
      }
      gone();
      const failed = pending.length;
      if (!map.size) {
        // Keys the board refused (no such key, e.g. 한자/한영 on ANSI) do not hide an all-zero profile.
        if (zero && !failed) throw new Error(tr('errAllZero'));
        throw new Error(tr('errNoneRead', { n: failed || refused, err: lastErr ? lastErr.message || lastErr : '-' }));
      }
      applyThresholds(map);
      state.thrProfile = profile;
      state.thrPartial = failed > 0;
      // RAM read after a RAM write this session holds values that revert on replug: use, never save.
      state.ramEdited = profile === 0 && (state.ramEdited || ramWritten());
      // A load with read failures is used for now but does not replace an earlier saved set.
      const save = !state.ramEdited && (!failed || !hasSavedThresholds());
      if (save) saveThresholds(profile);
      const time = hms(new Date());
      const extras = [];
      if (zero + refused) extras.push(['thrSkipped', { n: zero + refused }]);
      if (failed) extras.push([save ? 'thrFailedKeysSaved' : 'thrFailedKeys', { n: failed }]);
      if (state.ramEdited) extras.push(['thrRamNotSaved', null]);
      if (fellBack) extras.push(['thrFellBack', null]);
      thrStatus('thrLoaded', () => ({ p: profile === 0 ? '0 (RAM)' : profile, n: map.size, time }), extras);
    } catch (err) {
      if (err === SWITCHED) return; // another keyboard was picked; its own status is already shown
      if (err === LOST) return thrStatus('thrInterrupted');
      thrStatus('thrFailed', () => ({ err: err.message || err }));
    }
  });
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// ---------- HID ----------
function onInputReport(e) {
  if (!state.devices.includes(e.device || e.target)) return; // a device this page has let go of
  const bytes = new Uint8Array(e.data.buffer, e.data.byteOffset, e.data.byteLength);
  const family = state.family || P.familyOf(state.productId, e.reportId);
  state.rawLog.push(`#${e.reportId.toString(16).padStart(2, '0')}  ${P.hex(bytes)}`);
  if (state.rawLog.length > 20) state.rawLog.shift();
  if (!family && ++state.unrecognized === 1 && !$('noStream').classList.contains('hidden')) renderNoStream();
  if (!family || e.reportId !== P.FAMILIES[family].depthReportId) { state.dirty = true; return; }
  if (state.family !== family) {
    // Unknown model: the family was just learned from its depth report; points in device units
    // must be converted again. (Writes never use a guessed family.)
    state.family = family;
    if (state.thresholds.size) applyThresholds(state.thresholds);
    fillActuationRange();
  }
  if (state.mode === P.DEVICE_MODE.hardware) modeChanged(); // Synapse is back
  state.mode = P.DEVICE_MODE.driver; // the depth stream only flows in driver mode
  if (!state.streamSeen) {
    state.streamSeen = true;
    $('noStream').classList.add('hidden');
    renderModeHint();
  }
  state.tracker.update(P.parseDepthReport(family, bytes), e.timeStamp || performance.now());
  state.dirty = true;
}

/** Shown when no depth data arrived a few seconds after connecting. */
function renderNoStream() {
  // An unknown model whose reports are not the V3 depth format sends data this page cannot read.
  $('noStream').innerHTML = tr(state.unrecognized ? 'noStreamUnknownHtml' : 'noStreamHtml');
  $('noStream').classList.remove('hidden');
}

function renderModeHint() {
  $('modehint').textContent = tr('driverMode');
  $('modehint').classList.toggle('hidden', !state.devices.length || state.mode !== P.DEVICE_MODE.driver);
}

function renderDevName() {
  const model = P.MODELS[state.productId];
  let name = tr('notConnected');
  if (state.lostDevice && !state.devices.length) name = tr('disconnected');
  else if (state.productId !== null && model) name = `Razer ${model.name}`;
  else if (state.productId !== null) name = `PID ${state.productId.toString(16).padStart(4, '0')} (${tr('unknownModel')})`;
  $('devname').textContent = name;
}

function hasControlCollection(dev) {
  return (dev.collections || []).some((c) => (c.featureReports || []).some((r) => r.reportId === 0));
}

/** Groups Razer HIDDevices by product and picks one keyboard: the current one, else a known model. */
function pickKeyboard(devices) {
  const byPid = new Map();
  for (const d of devices) {
    if (d.vendorId !== P.VENDOR_RAZER) continue;
    if (!byPid.has(d.productId)) byPid.set(d.productId, []);
    byPid.get(d.productId).push(d);
  }
  if (!byPid.size) return [];
  if (state.productId !== null && byPid.has(state.productId)) return byPid.get(state.productId);
  const known = [...byPid.keys()].find((pid) => P.MODELS[pid]);
  return byPid.get(known !== undefined ? known : [...byPid.keys()][0]);
}

/** Lets go of every attached interface except `keep`; the state changes before anything awaits. */
function releaseDevices(keep = []) {
  const old = state.devices;
  state.devices = [];
  state.control = null;
  for (const d of old) {
    d.removeEventListener('inputreport', onInputReport);
    if (!keep.includes(d)) d.close().catch(() => { /* already gone */ });
  }
}

/** Forgets everything that belonged to the previous keyboard. */
function resetBoardState() {
  state.tracker.interrupt(performance.now()); // its held keys will not continue on the new board
  state.tracker.reset();
  state.family = null;
  state.multiUnit = false;
  state.ramEdited = false;
  state.thrPartial = false;
  state.tracker.setThresholds([]);
  state.thresholds = new Map();
  state.thrProfile = undefined;
  state.thrMsg = ['thrNotLoaded', null, []];
  state.undo = null;
  state.lastRead = null;
  state.mode = null;
  state.streamSeen = false;
  state.unrecognized = 0;
  state.chartKey = null;
  currentAssignment = null;
  $('actInfo').classList.add('hidden');
  $('thrLoad').classList.add('primary');
  renderThrStatus();
  renderUndo();
  refreshButtons();
  state.dirty = true;
}

/** Same interfaces twice in one product group means two physical keyboards of that model. */
function hasDuplicateUnits(group) {
  const sig = (d) => JSON.stringify((d.collections || []).map((c) => [c.usagePage, c.usage,
    (c.inputReports || []).map((r) => r.reportId), (c.featureReports || []).map((r) => r.reportId)]));
  const seen = new Set();
  for (const d of group) {
    const k = sig(d);
    if (seen.has(k)) return true;
    seen.add(k);
  }
  return false;
}

// One attach at a time, so a page-load or replug attach cannot overtake the user's pick.
let attachChain = Promise.resolve();
function attach(devices, user = false) {
  const run = attachChain.then(() => attachNow(devices, user));
  attachChain = run.catch(() => {});
  return run;
}

/**
 * Attaches one keyboard. `user` is true when the user picked it in the chooser; automatic
 * attaches (page load, replug) only take the keyboard already in use, or a known model.
 */
async function attachNow(devices, user) {
  const group = pickKeyboard(devices);
  if (!group.length) return;
  const pid = group[0].productId;
  if (!user && (state.productId !== null ? pid !== state.productId : !P.MODELS[pid])) return;
  // The chooser returns one physical keyboard: anything else attached (another model, or another
  // unit of this one) is let go, so reads and writes can only reach the keyboard that was picked.
  const isSwitch = () => pid !== state.productId
    || (user && !state.lostDevice && state.devices.some((d) => !group.includes(d)));
  // Never switch keyboards under a running read/write/undo/load.
  if (state.busy && isSwitch()) {
    if (user) throw new Error(tr('errBusySwitch'));
    return;
  }
  const opened = [];
  for (const d of group) {
    try {
      if (!d.opened) await d.open();
      opened.push(d);
    } catch (err) {
      console.warn('open failed', d, err);
    }
  }
  if (!opened.length) return;
  // Opening took time: an operation may have started meanwhile.
  const switching = isSwitch();
  if (state.busy && switching) {
    for (const d of opened) if (!state.devices.includes(d)) d.close().catch(() => {});
    if (user) throw new Error(tr('errBusySwitch'));
    return;
  }
  // Every read, write, Undo and loaded point went through state.control: a pick without it is
  // another unit of this model, and nothing recorded for the previous one applies to it.
  const otherUnit = switching && pid === state.productId && !group.includes(state.control);
  if (switching && (otherUnit || pid !== state.productId)) {
    releaseDevices(opened);
    state.productId = pid;
    resetBoardState();
    if (otherUnit) {
      setRamWritten(false); // that RAM write was on the other unit
      state.foreignBefore[pid] = Date.now(); // and so are the saved Undo and points so far
    }
  } else if (switching) {
    // The keyboard in use, picked out of two attached units: let the other go, keep the state.
    const control = state.control;
    releaseDevices(opened);
    state.control = control;
    if (state.undo && state.undo.device && !group.includes(state.undo.device)) state.undo = { ...state.undo, device: null };
    if (state.lastRead && !group.includes(state.lastRead.device)) state.lastRead = null;
  } else if (state.lostDevice) {
    ramReverted(); // replugged: RAM went back to the active profile
  }
  for (const d of opened) {
    if (state.devices.includes(d)) continue;
    d.addEventListener('inputreport', onInputReport);
    state.devices.push(d);
  }
  const model = P.MODELS[pid];
  state.family = model ? model.family : state.family; // unknown: learned from its depth reports
  // The chooser returns one physical keyboard; automatic attaches may see two of one model.
  state.multiUnit = !user && hasDuplicateUnits(state.devices);
  if (!state.devices.includes(state.control)) state.control = state.devices.find(hasControlCollection) || null;
  state.lostDevice = false;
  renderDevName();
  renderModeHint();
  $('dot').classList.toggle('on', state.devices.length > 0);
  $('connectError').classList.add('hidden');
  fillActuationRange();
  if (!state.thresholds.size) restoreThresholds();
  if (!state.undo) restoreUndo();
  refreshButtons();
  setTimeout(() => { if (!state.streamSeen && state.devices.length) renderNoStream(); }, 3000);
}

async function connect() {
  try {
    const devs = await navigator.hid.requestDevice({ filters: [{ vendorId: P.VENDOR_RAZER }] });
    if (!devs.length) return; // chooser cancelled
    await attach(devs, true);
    fillActuationRange();
    if (!state.devices.length || !pickKeyboard(devs).some((d) => state.devices.includes(d))) throw new Error(tr('errOpen'));
  } catch (err) {
    $('connectError').textContent = String(err.message || err);
    $('connectError').classList.remove('hidden');
  }
}

function onDisconnect(e) {
  if (!state.devices.includes(e.device)) return;
  e.device.removeEventListener('inputreport', onInputReport);
  state.devices = state.devices.filter((d) => d !== e.device);
  if (state.control === e.device) state.control = null;
  if (state.lastRead && state.lastRead.device === e.device) state.lastRead = null; // read again after a replug
  state.multiUnit = state.multiUnit && hasDuplicateUnits(state.devices);
  if (!state.devices.length) {
    // Keep the keyboard's identity, points and Undo for a replug; end what was live.
    state.lostDevice = true;
    state.tracker.interrupt(performance.now());
    state.streamSeen = false;
    state.mode = null;
    state.dirty = true;
  }
  $('dot').classList.toggle('on', state.devices.length > 0);
  renderDevName();
  renderModeHint();
  fillActuationRange();
  refreshButtons();
}

// ---------- control channel ----------
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// One request at a time: the actuation tab and threshold loading share the control channel.
let exchangeChain = Promise.resolve();
function exchange(packet, device = null) {
  // Refuse anything outside the safety allowlist. Writes are checked against the connected
  // model's family and range from the model table, never a guessed family.
  const model = P.MODELS[state.productId];
  try {
    P.checkPacket(packet, model ? model.family : null, P.writeRange(state.productId));
  } catch (err) {
    return Promise.reject(new Error(tr('errSafety', { detail: err.message })));
  }
  const run = exchangeChain.then(() => exchangeNow(packet, device));
  exchangeChain = run.catch(() => {});
  return run;
}

/** An error worth sending the request again for: the channel answered someone else. */
function retryable(message) {
  const err = new Error(message);
  err.retry = true;
  return err;
}

async function exchangeNow(packet, device = null) {
  const cls = packet[6], cmd = packet[7];
  const isWrite = cls === P.KEY_ASSIGNMENT.cls && cmd === P.KEY_ASSIGNMENT.set;
  if (device && !state.devices.includes(device)) throw new Error(tr('errDeviceChanged'));
  // Reads may probe the keyboard's interfaces to find the control channel; a write only ever
  // goes to the one that already answered (and, when given, the one it was prepared for).
  const candidates = device ? [device] : state.control ? [state.control] : isWrite ? [] : state.devices;
  let lastErr = new Error(tr('errNoControl'));
  for (const dev of candidates) {
    // Synapse shares the control channel while it runs, so a reply can belong to its request.
    for (let attempt = 0; attempt < 5; attempt++) {
      try {
        await dev.sendFeatureReport(0, packet);
        for (let i = 0; i < 20; i++) {
          await sleep(i === 0 ? 5 : 20);
          const reply = P.parseReply(await dev.receiveFeatureReport(0), cls, cmd);
          if (!reply) throw retryable(tr('errBadReply'));
          if (reply.status === 1) continue;
          if (reply.status !== 2) {
            const err = new Error(tr('errStatus', { s: reply.statusText }));
            err.status = reply.status; // 03 fail / 05 not supported: the keyboard said no
            err.args = reply.args; //     ... to the request these args name
            throw err;
          }
          state.control = dev;
          return reply;
        }
        throw retryable(tr('errBusy'));
      } catch (err) {
        lastErr = err;
        if (!err.retry) break;
        await sleep(20 + attempt * 30);
      }
    }
  }
  throw lastErr;
}

let currentAssignment = null;

function actLog(line) {
  $('actLog').textContent = `${hms(new Date())}  ${line}\n` + $('actLog').textContent;
}

async function resolveProfile() {
  return $('actProfile').value === 'active' ? activeProfile() : 0;
}

async function activeProfile() {
  let r;
  try {
    r = await exchange(P.buildPacket(P.ACTIVE_PROFILE.cls, P.ACTIVE_PROFILE.get, 1));
  } catch (err) {
    // Seen on the V3 Pro 8KHz: while Synapse runs (driver mode) 05:84 gets no answer.
    throw new Error(tr('errActiveProfile', { err: err.message || err }));
  }
  const slot = r.args[0];
  if (slot < 1 || slot > 6) throw new Error(tr('errProfile', { n: slot }));
  return slot;
}

async function readKey(profile, key, device = null) {
  let r = null, foreign = null;
  for (let attempt = 0; attempt < 5; attempt++) {
    try {
      r = await exchange(P.getKeyAssignmentPacket(profile, key, 0), device);
    } catch (err) {
      // A refusal naming another key, profile or layer answered another program's request.
      const x = err.status && err.args && err.args.some((b) => b) ? err.args : null;
      if (!x || (x[0] === profile && x[1] === key && x[2] === 0)) throw err;
      foreign = err;
      await sleep(20);
      continue;
    }
    const a = P.parseKeyAssignment(r.args);
    // Another program may have read a different key in between: ask again.
    // Layer too: Synapse may read the same key's Hypershift layer, and writing that reply back
    // would put these thresholds on the wrong layer.
    if (a && a.key === key && a.profile === profile && a.layer === 0) return a;
    await sleep(20);
  }
  // Not a status error: the key is retried, never counted as one the board refused.
  throw new Error(r ? tr('errKeyReply', { hex: P.hex(r.args.slice(0, 12)) }) : foreign.message);
}

function showAssignment(a) {
  const f = P.FAMILIES[state.family || 'v3'];
  $('actInfo').innerHTML = `
    <dt>${tr('dtKey')}</dt><dd>${esc(keyName(a.key))} (fwID ${a.key})</dd>
    <dt>${tr('dtProfile')}</dt><dd>${a.profile === 0 ? tr('profRam') : tr('profSlot', { n: a.profile })}</dd>
    <dt>${tr('dtAct')}</dt><dd>${a.thrL} → ≈${f.thresholdToMm(a.thrL).toFixed(2)} mm</dd>
    <dt>${tr('dtRel')}</dt><dd>${a.thrH} → ≈${f.thresholdToMm(a.thrH).toFixed(2)} mm</dd>
    <dt>${tr('dtFn')}</dt><dd>fnId ${a.fnId} [${P.hex(a.fnData)}]</dd>`;
  $('actInfo').classList.remove('hidden');
}

async function withBusy(fn) {
  state.busy = true;
  refreshButtons();
  try {
    await fn();
  } finally {
    state.busy = false;
    refreshButtons();
  }
}

/** Write needs consent and a fresh read of the selected key and target. */
function refreshButtons() {
  const lr = state.lastRead;
  const fresh = lr && lr.productId === state.productId && lr.key === Number($('actKey').value) && lr.sel === $('actProfile').value;
  $('actRead').disabled = state.busy;
  $('thrLoad').disabled = state.busy;
  $('connect').disabled = state.busy || !('hid' in navigator); // no keyboard switch mid-operation
  $('actUndo').disabled = state.busy || !$('safetyAgree').checked;
  $('actWrite').disabled = state.busy || !$('safetyAgree').checked || !fresh || !state.devices.length;
}

function requireKnownModel() {
  if (!state.devices.length) throw new Error(tr('errConnectFirst'));
  const model = P.MODELS[state.productId];
  if (!model) throw new Error(tr('errUnknownModel'));
  if (state.multiUnit) throw new Error(tr('errMultipleUnits'));
  return { family: P.FAMILIES[model.family], range: P.writeRange(state.productId) };
}

/** Throws if the keyboard changed (or went away) since `pid` was captured. */
function sameBoard(pid) {
  if (!state.devices.length || state.productId !== pid) throw new Error(tr('errDeviceChanged'));
}

/** The read the pre-filled fields came from, if it matches this key and resolved profile. */
function freshRead(key, profile) {
  const lr = state.lastRead;
  return lr && lr.productId === state.productId && lr.key === key && lr.profile === profile ? lr : null;
}

async function onRead() {
  if (state.busy) return;
  await withBusy(async () => {
    try {
      if (!state.devices.length) throw new Error(tr('errConnectFirst'));
      const key = Number($('actKey').value);
      const sel = $('actProfile').value;
      const profile = await resolveProfile();
      currentAssignment = await readKey(profile, key);
      showAssignment(currentAssignment);
      const f = fam();
      const mmL = f.thresholdToMm(currentAssignment.thrL).toFixed(1);
      const mmH = f.thresholdToMm(currentAssignment.thrH).toFixed(1);
      $('actMm').value = mmL;
      $('actRelMm').value = mmH;
      // Remember the exact values so an untouched field writes back what was read, not a rounded value.
      state.lastRead = { productId: state.productId, device: state.control, key, sel, profile,
        thrL: currentAssignment.thrL, thrH: currentAssignment.thrH, mmL, mmH };
      actLog(tr('readOk', { key: keyName(key), p: profile }));
    } catch (err) {
      actLog(tr('readFail', { err: err.message || err }));
    }
  });
}

/** Turns the two mm fields into thresholds, keeping exact read values for untouched fields. */
function wantedPoints(f, range, key, profile) {
  const lr = freshRead(key, profile);
  const loMm = mmBound(f, range, range.lo), hiMm = mmBound(f, range, range.hi);
  const mmStr = $('actMm').value.trim();
  const mmNum = Number(mmStr);
  let thrL = NaN;
  if (lr && mmStr === lr.mmL) thrL = lr.thrL;
  else if (mmStr !== '' && Number.isFinite(mmNum)) {
    // Out-of-range input is refused, not clamped into range. The printed bounds themselves are
    // accepted (V3 prints 4.0 although its threshold 255 is 3.985 mm).
    const units = f.mmToUnits(mmNum);
    const inRange = (mmNum >= Number(loMm) && mmNum <= Number(hiMm)) || (units > range.lo - 0.5 && units < range.hi + 0.5);
    if (inRange) thrL = f.mmToThreshold(mmNum);
  }
  if (!(thrL >= range.lo && thrL <= range.hi)) throw new Error(tr('errRange', { lo: loMm, hi: hiMm }));
  const relStr = $('actRelMm').value.trim();
  let thrH = null;
  if (relStr !== '' && !(lr && relStr === lr.mmH && lr.thrH < f.minRelease)) {
    // (An untouched release below the firmware floor, e.g. V2's 0/0 from Synapse, means "keep":
    // withActuation lifts it to the floor.)
    const rel = Number(relStr);
    thrH = lr && relStr === lr.mmH ? lr.thrH : Number.isFinite(rel) ? f.mmToRelease(rel) : NaN;
    if (thrH < f.minRelease) throw new Error(tr('errReleaseFloor', { floor: releaseFloorMm(f) }));
    if (!(thrH <= thrL - f.minReleaseGap)) {
      throw new Error(tr('errRelease', { mm: f.thresholdToMm(thrL).toFixed(2) }));
    }
  }
  return { thrL, thrH };
}

/** Shallowest release the firmware keeps (V2: threshold 5, typed as 1.54). */
function releaseFloorMm(f) {
  return f.minRelease ? P.mmExact(f, f.minRelease) : '0';
}

/** Device mode before a write: 'driver' (Synapse), 'hardware', or 'unknown'. */
async function deviceMode() {
  try {
    const r = await exchange(P.getDeviceModePacket());
    if (r.args[0] === P.DEVICE_MODE.hardware) {
      if (state.mode === P.DEVICE_MODE.driver) modeChanged(); // Synapse quit
      state.mode = P.DEVICE_MODE.hardware;
      // The stream stopped some time after its last report; end what was live there.
      if (state.streamSeen) state.tracker.interrupt(state.tracker.lastT);
      state.streamSeen = false;
      renderModeHint();
      state.dirty = true;
      return 'hardware';
    }
    if (r.args[0] === P.DEVICE_MODE.driver) {
      state.mode = P.DEVICE_MODE.driver;
      renderModeHint();
      return 'driver';
    }
  } catch (err) { /* unanswered: Synapse may hold the channel */ }
  return state.streamSeen ? 'driver' : 'unknown'; // the depth stream only flows in driver mode
}

/** Asks before a write unless the keyboard said it is in hardware mode. */
async function confirmMode() {
  const mode = await deviceMode();
  return mode === 'hardware' || confirm(tr(mode === 'driver' ? 'confirmSynapse' : 'confirmModeUnknown'));
}

async function onWrite() {
  if (state.busy) return;
  await withBusy(async () => {
    let sent = false;
    try {
      const { family: f, range } = requireKnownModel();
      if (!$('safetyAgree').checked) throw new Error(tr('errConsent'));
      const pid = state.productId;
      const key = Number($('actKey').value);
      const profile = await resolveProfile();
      sameBoard(pid);
      const { thrL, thrH } = wantedPoints(f, range, key, profile);
      const lr = freshRead(key, profile);
      if (!lr) throw new Error(tr('errChangedSinceRead'));
      // Everything below goes to the keyboard the fields were read from, or nowhere.
      const device = lr.device;
      if (!device || !state.devices.includes(device)) throw new Error(tr('errDeviceChanged'));
      if (!(await confirmMode())) return;
      if (profile !== 0 && !confirm(tr('confirmFlash', { p: profile }))) return;

      sameBoard(pid);
      const before = await readKey(profile, key, device); // always start from the device's current value
      // The fields were filled from an earlier read; refuse if the key changed since then.
      if (before.thrL !== lr.thrL || before.thrH !== lr.thrH) throw new Error(tr('errChangedSinceRead'));
      const wanted = P.withActuation(before, thrL, thrH, f.minReleaseGap, f.minRelease);
      if (wanted.thrL === before.thrL && wanted.thrH === before.thrH) {
        actLog(tr('writeSame', { key: keyName(key) }));
        return;
      }
      // Undo must be able to put `before` back; warn now if the safety policy would refuse that.
      let undoable = true;
      try {
        P.checkPacket(P.setKeyAssignmentPacket(before), P.MODELS[pid].family, range);
      } catch (err) {
        undoable = false;
        const mmOf = (t) => f.thresholdToMm(t).toFixed(2);
        if (!confirm(tr('confirmNoUndo', { a: mmOf(before.thrL), b: mmOf(before.thrH) }))) return;
      }
      if (undoable) {
        // Recorded before sending, so a write whose result cannot be confirmed can still be undone.
        // An earlier unconfirmed write to the same key keeps the true original values.
        const prev = state.undo;
        const same = prev && prev.pending && prev.productId === pid && prev.profile === profile && prev.key === key;
        // Originals carried over from a record made on another connection may be another unit's.
        setUndo({ productId: pid, profile, key, thrL: same ? prev.thrL : before.thrL, thrH: same ? prev.thrH : before.thrH,
          wroteL: wanted.thrL, wroteH: wanted.thrH, pending: true, at: Date.now(),
          device: same && prev.device !== device ? null : device });
      } else {
        setUndo(null); // Undo must never point at an older write than the last one
      }
      sameBoard(pid);
      if (profile === 0) setRamWritten(true); // before sending: RAM may change even if the read-back fails
      sent = true;
      await exchange(P.setKeyAssignmentPacket(wanted), device);
      const after = await readKey(profile, key, device);
      if (undoable && state.undo) setUndo({ ...state.undo, pending: false });
      currentAssignment = after;
      showAssignment(after);
      state.lastRead = null;
      const ok = after.thrL === wanted.thrL && after.thrH === wanted.thrH && after.fnId === before.fnId;
      updateMonitorPoints(profile, key, after);
      const mmOf = (t) => f.thresholdToMm(t).toFixed(2);
      actLog(`${tr(ok ? 'writeOk' : 'writeMismatch')}: ` + tr('writeDetail', { key: keyName(key), p: profile,
        a: mmOf(before.thrL), b: mmOf(after.thrL), c: mmOf(before.thrH), d: mmOf(after.thrH) }));
    } catch (err) {
      actLog(tr(sent ? 'writeUnconfirmed' : 'writeFail', { err: err.message || err }));
      if (sent && state.thresholds.size) thrStatus('thrUnconfirmed');
    }
  });
}

/** Keeps the monitor's points (and the saved copy) in step with a write. */
function updateMonitorPoints(profile, key, after) {
  if (profile === 0) setRamWritten(true);
  else patchSavedThreshold(profile, key, after); // flash keeps it
  if (!state.thresholds.size) return;
  if (profile !== state.thrProfile) {
    thrStatus('thrStale');
    return;
  }
  if (after.thrL > 0) state.thresholds.set(key, { thrL: after.thrL, thrH: after.thrH });
  else state.thresholds.delete(key); // 0/0: the host decides, nothing to judge against
  applyThresholds(state.thresholds);
  if (profile === 0) state.ramEdited = true; // reverts on replug, so never saved
}

const UNDO_KEY = 'rsf.undo.v1';

function setUndo(u) {
  state.undo = u;
  try {
    if (u) {
      const { device, ...stored } = u; // a device lives only as long as this page
      localStorage.setItem(UNDO_KEY, JSON.stringify(stored));
    } else localStorage.removeItem(UNDO_KEY);
  } catch (err) { /* Undo just won't survive a reload */ }
  renderUndo();
}

/** Brings back the last Undo after a reload, for the same keyboard model only. */
function restoreUndo() {
  try {
    const u = JSON.parse(localStorage.getItem(UNDO_KEY) || 'null');
    const byte = (v) => Number.isInteger(v) && v >= 0 && v <= 255;
    if (u && u.productId === state.productId && Number.isInteger(u.profile) && u.profile >= 0 && u.profile <= 6
        && P.KEY_NAMES[u.key] && byte(u.thrL) && byte(u.thrH)
        && (Number(u.at) || 0) > foreignCutoff()) { // not made on the unit picked away from
      // No device: which keyboard it was made on is unknown now, so Undo asks before writing.
      state.undo = { productId: u.productId, profile: u.profile, key: u.key, thrL: u.thrL, thrH: u.thrH, pending: !!u.pending, device: null };
      if (byte(u.wroteL) && byte(u.wroteH)) Object.assign(state.undo, { wroteL: u.wroteL, wroteH: u.wroteH });
      if (Number.isFinite(u.at)) state.undo.at = u.at;
      renderUndo();
    }
  } catch (err) { /* ignore unreadable record */ }
}

function renderUndo() {
  const u = state.undo;
  $('actUndo').classList.toggle('hidden', !u);
  if (!u) return;
  const model = P.MODELS[u.productId];
  const f = model ? P.FAMILIES[model.family] : fam();
  $('actUndo').textContent = tr('undoBtn', { key: keyName(u.key), a: f.thresholdToMm(u.thrL).toFixed(2), b: f.thresholdToMm(u.thrH).toFixed(2) })
    + (u.profile === 0 ? '' : ` · ${tr('profSlot', { n: u.profile })}`);
}

/** Puts back exactly the points the last write replaced, on the same keyboard, key and profile. */
async function onUndo() {
  const u = state.undo;
  if (!u || state.busy) return;
  await withBusy(async () => {
    let sent = false;
    try {
      requireKnownModel();
      if (!$('safetyAgree').checked) throw new Error(tr('errConsent'));
      const pid = state.productId;
      if (u.productId !== pid) throw new Error(tr('errUndoOtherDevice'));
      if (!(await confirmMode())) return;
      if (u.profile !== 0 && !confirm(tr('confirmFlash', { p: u.profile }))) return;
      sameBoard(pid);
      const now = await readKey(u.profile, u.key);
      const device = state.control;
      const f = fam();
      const mmOf = (t) => f.thresholdToMm(t).toFixed(2);
      if (now.thrL === u.thrL && now.thrH === u.thrH) {
        // Already the originals. Flash keeps a write across a reconnect, so on another connection
        // this may be another unit of the model: the record is only dropped if the user says so.
        if (u.device !== device && u.profile !== 0
            && !confirm(tr('confirmUndoAlready', { key: keyName(u.key), a: mmOf(u.thrL), b: mmOf(u.thrH) }))) {
          actLog(tr('undoKept', { key: keyName(u.key) }));
          return;
        }
      } else {
        if (u.wroteL !== undefined && (now.thrL !== u.wroteL || now.thrH !== u.wroteH)) {
          // Not what this tool wrote: another keyboard of the same model, or changed since.
          if (!confirm(tr('confirmUndoChanged', { cur: `${mmOf(now.thrL)} / ${mmOf(now.thrH)}`, wrote: `${mmOf(u.wroteL)} / ${mmOf(u.wroteH)}` }))) return;
        } else if (u.device !== device) {
          // Recorded before a reload or reconnect: the same value on another unit looks identical.
          const when = u.at ? new Date(u.at).toLocaleString(I18N.locale()) : '?';
          if (!confirm(tr('confirmUndoUnit', { when, key: keyName(u.key), a: mmOf(u.thrL), b: mmOf(u.thrH) }))) return;
        }
        sameBoard(pid);
        if (u.profile === 0) setRamWritten(true);
        sent = true;
        await exchange(P.setKeyAssignmentPacket({ ...now, thrL: u.thrL, thrH: u.thrH }), device);
      }
      const after = await readKey(u.profile, u.key, device);
      const ok = after.thrL === u.thrL && after.thrH === u.thrH;
      updateMonitorPoints(u.profile, u.key, after);
      if (currentAssignment && currentAssignment.key === u.key) { currentAssignment = after; showAssignment(after); }
      state.lastRead = null;
      actLog(tr(ok ? 'undoOk' : 'writeMismatch') + `: ${keyName(u.key)}`);
      if (ok && state.undo === u) setUndo(null);
    } catch (err) {
      actLog(tr(sent ? 'undoUnconfirmed' : 'undoFail', { err: err.message || err }));
      if (sent && state.thresholds.size) thrStatus('thrUnconfirmed');
    }
  });
}

/** The shortest mm value a user can type that still converts to a threshold inside the range. */
function mmBound(f, range, thr) {
  const mm = f.thresholdToMm(thr);
  for (const d of [1, 2, 3]) {
    const t = f.mmToThreshold(Number(mm.toFixed(d)));
    if (t >= range.lo && t <= range.hi) return mm.toFixed(d);
  }
  return mm.toFixed(3);
}

function fillActuationRange() {
  const f = fam();
  const range = P.writeRange(state.productId);
  if (!range) {
    $('actRange').textContent = state.productId === null ? '' : tr('errUnknownModel');
    return;
  }
  const lo = mmBound(f, range, range.lo), hi = mmBound(f, range, range.hi);
  $('actMm').min = lo;
  $('actMm').max = hi;
  $('actRelMm').min = releaseFloorMm(f);
  $('actRange').textContent = state.multiUnit ? tr('errMultipleUnits') : tr('rangeNote', { lo, hi });
}

function selectActuationKey(id) {
  $('actKey').value = String(id);
  for (const [k, el] of keyEls) el.classList.toggle('selected', k === id);
  refreshButtons(); // a write needs a fresh read of this key
}

function fillKeySelect() {
  const keep = $('actKey').value || String(P.WIN_KEY);
  const ids = Object.keys(P.KEY_NAMES).map(Number).sort((a, b) => a - b);
  $('actKey').innerHTML = ids.map((id) => `<option value="${id}">${esc(keyName(id))} (fwID ${id})</option>`).join('');
  $('actKey').value = keep;
}

/** Puts every visible string into the current language; safe to call again after switching. */
function applyLanguage() {
  I18N.apply(document);
  for (const [id, el] of keyEls) {
    el.title = `${keyName(id)} (fwID ${id})`;
    el.querySelector('.lbl').textContent = langStrings().keyNames[id] || P.shortKeyName(id);
  }
  fillKeySelect();
  renderDevName();
  renderModeHint();
  renderThrStatus();
  if (!$('noStream').classList.contains('hidden')) renderNoStream();
  if (currentAssignment) showAssignment(currentAssignment);
  renderUndo();
  fillActuationRange();
  chart.readout = '';
  state.dirty = true;
}

// ---------- CSV ----------
function exportCsv() {
  const t = state.tracker;
  const f = fam();
  const mmOr = (raw) => (raw === null || raw === undefined ? '' : f.rawToMm(raw).toFixed(3));
  const lines = ['type,key,fwID,start_ms,duration_ms,peak_raw,peak_mm,input,activations,first_input_ms,input_held_ms,actuation_mm,release_mm'];
  for (const e of t.events) {
    lines.push(['touch', csvCell(keyName(e.id)), e.id, e.start.toFixed(1), e.durationMs.toFixed(1), e.peak, mmOr(e.peak),
      e.fired === null ? '' : e.fired ? 'yes' : 'no', e.activations, e.firstOnMs === null ? '' : e.firstOnMs.toFixed(1),
      e.heldMs.toFixed(1), mmOr(e.press), mmOr(e.release)].join(',')); // the points this touch was judged with
  }
  for (const r of t.ranking()) {
    const thr = thrRaw(r.id);
    lines.push(['summary', csvCell(keyName(r.id)), r.id, '', r.totalMs.toFixed(1), r.peak, mmOr(r.peak),
      r.activations ? 'yes' : thr && r.judgedTouches && r.peak < thr.press ? 'no' : '', r.activations, '', '', thr ? mmOr(thr.press) : '', thr ? mmOr(thr.release) : ''].join(','));
  }
  const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `sensorfinder-${new Date().toISOString().replace(/[:.]/g, '-')}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function csvCell(s) {
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

// ---------- wiring ----------
function init() {
  buildKeyboard();
  applyLanguage();
  $('thrLoad').classList.add('primary'); // highlighted until points are loaded
  selectActuationKey(P.WIN_KEY);
  $('actKey').addEventListener('change', () => selectActuationKey(Number($('actKey').value)));
  $('lang').addEventListener('click', () => {
    I18N.set(I18N.lang === 'ko' ? 'en' : 'ko');
    applyLanguage();
  });
  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
    $('tab-monitor').classList.toggle('hidden', b.dataset.tab !== 'monitor');
    $('tab-actuation').classList.toggle('hidden', b.dataset.tab !== 'actuation');
    // Opening the write tab is a good moment to learn whether Synapse is still running.
    if (b.dataset.tab === 'actuation' && state.devices.length && !state.busy) deviceMode();
  }));
  $('reset').addEventListener('click', () => { state.tracker.reset(); state.dirty = true; });
  refreshButtons();
  $('noise').addEventListener('change', () => { state.tracker.noiseFloor = Math.max(0, Number($('noise').value) || 0); });
  $('csv').addEventListener('click', exportCsv);
  $('thrLoad').addEventListener('click', loadThresholds);
  $('chartWrap').addEventListener('mousemove', (e) => { chart.hoverX = e.offsetX; });
  $('chartWrap').addEventListener('mouseleave', () => { chart.hoverX = null; });
  $('follow').addEventListener('change', () => { if ($('follow').checked) state.chartKey = state.tracker.lastId; });
  $('rawToggle').addEventListener('change', () => { $('raw').classList.toggle('hidden', !$('rawToggle').checked); state.dirty = true; });
  $('actRead').addEventListener('click', onRead);
  $('actWrite').addEventListener('click', onWrite);
  $('actUndo').addEventListener('click', onUndo);
  try { $('safetyAgree').checked = localStorage.getItem('rsf.safetyAgreed.v1') === '1'; } catch (err) { /* ask again */ }
  $('safetyAgree').addEventListener('change', () => {
    try { localStorage.setItem('rsf.safetyAgreed.v1', $('safetyAgree').checked ? '1' : '0'); } catch (err) { /* not remembered */ }
    refreshButtons();
  });
  $('actRelSuggest').addEventListener('click', () => {
    const f = fam();
    const text = $('actMm').value.trim();
    const mm = Number(text);
    if (!(mm > 0)) return;
    // 0.2 mm shallower, kept within the firmware's floor and minimum gap.
    const lr = state.lastRead;
    const thrL = lr && text === lr.mmL ? lr.thrL : f.mmToThreshold(mm);
    const thrH = Math.max(f.minRelease, Math.min(f.mmToRelease(mm - 0.2), thrL - f.minReleaseGap));
    if (thrH > thrL - f.minReleaseGap) return;
    // The text Read filled in means "keep the value read": use a longer one for another value.
    let out = P.mmExact(f, thrH);
    if (lr && out === lr.mmH && thrH !== lr.thrH) out = P.mmExact(f, thrH, 2);
    $('actRelMm').value = out;
  });
  $('actProfile').addEventListener('change', refreshButtons);

  if (!('hid' in navigator)) {
    $('unsupported').classList.remove('hidden');
    $('connect').disabled = true;
  } else {
    $('connect').addEventListener('click', connect);
    navigator.hid.getDevices().then((devs) => attach(devs));
    // A replugged keyboard that was already allowed comes back by itself.
    navigator.hid.addEventListener('connect', (e) => attach([e.device]));
    navigator.hid.addEventListener('disconnect', onDisconnect);
    // Coming back to this window is when Synapse has most likely been started or quit.
    let lastModeCheck = -Infinity;
    window.addEventListener('focus', () => {
      if (!state.devices.length || state.busy || performance.now() - lastModeCheck < 5000) return;
      lastModeCheck = performance.now();
      deviceMode();
    });
  }
  requestAnimationFrame(render);
}
init();
</script>
